<index html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico 2 W OLED Simulator</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { font-size: 1.2rem; color: #94a3b8; margin-bottom: 15px; }
        .oled-container { border: 4px solid #334155; border-radius: 12px; padding: 12px; background: #000; box-shadow: 0 0 25px rgba(56,189,248,0.2); }
        /* 128x64 の画面をスマホで見やすいよう3倍サイズ（384x192）で描画 */
        canvas { background: #000; image-rendering: pixelated; width: 384px; height: 192px; border-radius: 4px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; margin-bottom: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🚶 Pico 2 W ディスプレイシミュレーター</h1>
    <button id="connectBtn" onclick="connectBLE()">Pico 2 W と接続する</button>

    <div class="oled-container">
        <canvas id="oled" width="128" height="64"></canvas>
    </div>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        const canvas = document.getElementById('oled');
        const ctx = canvas.getContext('2d');

        // Pico 2 W 側と全く同じドット絵パターン（8x8）
        const man_pattern1 = [0x30, 0x30, 0x78, 0xB4, 0x30, 0x20, 0x50, 0x50];
        const man_pattern2 = [0x30, 0x30, 0x78, 0x78, 0x30, 0x40, 0x50, 0x48];

        // 内部状態変数
        let state = {
            date: "----/--/--",
            time: "--:--:--",
            steps: 0,
            charX: 0,
            animeTick: 0
        };

        // 8x8のドット絵を描画する関数
        function drawDotCharacter(ox, oy, pattern) {
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((0x80 >> col) & pattern[row]) {
                        // 1ドットを 2x2 ピクセルサイズで拡大描画
                        ctx.fillRect(ox + col * 2, oy + row * 2, 2, 2);
                    }
                }
            }
        }

        // OLED画面全体を再描画する関数
        function drawOLED() {
            // 背景クリア（黒）
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, 128, 64);

            // 文字・ドット絵描画（白）
            ctx.fillStyle = "#fff";
            ctx.font = "10px monospace";

            ctx.fillText(`DATE ${state.date}`, 0, 10);
            ctx.fillText(`TIME ${state.time}`, 0, 20);
            ctx.fillText(`HOSUU ${state.steps}歩`, 0, 30);
            ctx.fillText(`BLE:ON`, 0, 40);

            // アニメーションコマの切り替え (足交互動作)
            const currentPattern = (Math.floor(state.animeTick / 2) % 2 === 0) ? man_pattern1 : man_pattern2;
            
            // Y座標 48 (下部) に歩く人を描画
            drawDotCharacter(state.charX, 48, currentPattern);
        }

        async function connectBLE() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Pico2W-Step' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                const characteristic = await service.getCharacteristic(UART_TX_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    const value = new TextDecoder().decode(e.target.value).trim();

                    // データ受信時の処理
                    if (value.startsWith("DATA:")) {
                        const parts = value.replace("DATA:", "").split(",");
                        if (parts.length === 3) {
                            state.date = parts[0];
                            state.time = parts[1];
                            state.steps = parseInt(parts[2]);
                        }
                    } else if (value.startsWith("STEPS:")) {
                        // 一歩歩いた時の動き（位置を右にずらし、アニメーションコマを進める）
                        state.charX += 6;
                        if (state.charX > 128) {
                            state.charX = -16;
                        }
                        state.animeTick++;
                    }

                    drawOLED();
                });

                document.getElementById('connectBtn').style.display = 'none';
                drawOLED();
            } catch (error) {
                alert("接続エラー: " + error);
            }
        }

        // 初期表示
        drawOLED();
    </script>
</body>
</html>
