<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico 2 W リアルタイム万歩計 & コースナビ</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }
        h1 { font-size: 1.2rem; color: #94a3b8; margin-bottom: 15px; }
        .card { 
            background: #1e293b; 
            border-radius: 16px; 
            padding: 20px; 
            max-width: 400px; 
            width: 100%; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            box-sizing: border-box; 
        }
        .steps { font-size: 3.5rem; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        .unit { font-size: 1.2rem; color: #94a3b8; }
        
        /* プログレスバー */
        .progress-bg { background: #334155; border-radius: 10px; height: 14px; overflow: hidden; margin: 12px 0 6px; }
        .progress-bar { background: linear-gradient(90deg, #38bdf8, #4ade80); height: 100%; width: 0%; transition: width 0.3s; }
        
        .info { display: flex; justify-content: space-between; color: #94a3b8; font-size: 0.9rem; margin-top: 15px; }
        
        /* ボタン共通 */
        button { 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            padding: 12px 24px; 
            font-size: 1rem; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-bottom: 10px; 
            width: 100%;
            box-sizing: border-box;
        }
        button:disabled { background: #64748b; color: #cbd5e1; cursor: not-allowed; }
        
        .sync-btn { background: #4ade80; margin-bottom: 20px; }

        /* OLED画面シミュレータ */
        .oled-container { background: #000; border: 3px solid #334155; border-radius: 10px; padding: 10px; display: flex; justify-content: center; box-shadow: inset 0 0 10px rgba(56,189,248,0.2); margin-top: 15px; }
        canvas { background: #000; width: 100%; height: auto; aspect-ratio: 2 / 1; }
        
        /* コース進捗カード */
        .course-info { margin-top: 20px; text-align: left; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        .course-title { font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }
        .location-name { font-size: 1.2rem; font-weight: bold; color: #4ade80; margin: 5px 0; }
        .distance-text { font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>

    <h1>🏃 Pico 2 W 万歩計ダッシュボード</h1>
    
    <button id="connectBtn" onclick="connectBLE()">Pico 2 W に接続</button>
    <button id="syncBtn" class="sync-btn" onclick="syncTime()" disabled>📲 スマホの現在時刻をPicoに同期</button>

    <div class="card">
        <h1>🚶 Web Bluetooth 歩数メーター</h1>
        <div><span class="steps" id="steps">0</span> <span class="unit">歩</span></div>
        
        <div class="progress-bg"><div class="progress-bar" id="stepBar"></div></div>
        <div class="info"><span>目標: 10,000歩</span><span id="rate">0%</span></div>
        
        <hr style="border: 0.5px solid #334155; margin: 20px 0;">
        
        <div class="info"><span id="date">----/--/--</span><span id="time">--:--:--</span></div>

        <!-- クッキリ表示される高解像度OLEDキャンバス -->
        <div class="oled-container">
            <canvas id="oled" width="512" height="256"></canvas>
        </div>

        <!-- マラソン・駅伝ナビゲーションエリア -->
        <div class="course-info">
            <div class="course-title">🎽 走破状況ナビ（歩幅70cm換算）</div>
            <div class="location-name" id="locName">スタート前</div>
            <div class="distance-text" id="distText">累計: 0 m / 42,195 m</div>
            
            <div class="progress-bg"><div class="progress-bar" id="courseBar"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #64748b;">
                <span>フルマラソン完走まで</span>
                <span id="percent">0%</span>
            </div>
        </div>
    </div>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 受信（Pico -> スマホ）
        const UART_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // 送信（スマホ -> Pico）
        
        const TARGET_STEPS = 10000;
        
        let bleDevice = null;
        let rxCharacteristic = null;

        // 高解像度キャンバス（倍率4倍：512x256）
        const canvas = document.getElementById('oled');
        const ctx = canvas.getContext('2d');
        const SCALE = 4;

        const man_pattern1 = [0x30, 0x30, 0x78, 0xB4, 0x30, 0x20, 0x50, 0x50];
        const man_pattern2 = [0x30, 0x30, 0x78, 0x78, 0x30, 0x40, 0x50, 0x48];
        
        let state = { date: "----/--/--", time: "--:--:--", steps: 0, charX: 0, animeTick: 0 };

        // 走破ポイントの定義（歩幅70cm＝0.7m計算）
        const STAGES = [
            { dist: 0,     name: "🏁 スタート（東京都庁）" },
            { dist: 5000,  name: "⛩ 飯田橋・市ヶ谷付近 (5km)" },
            { dist: 7000,  name: "🎯 10,000歩達成！(7km地点)" },
            { dist: 10000, name: "🗼 日本橋付近 (10km)" },
            { dist: 15000, name: "🗼 東京タワー前 (15km)" },
            { dist: 21097, name: "🏃 ハーフマラソン通過 (21.1km)" },
            { dist: 30000, name: "🔥 30kmの壁到達！ (30km)" },
            { dist: 42195, name: "🏆 フルマラソンゴール！（東京駅）" }
        ];

        // 高解像度でのドット絵描画
        function drawDotCharacter(ox, oy, pattern) {
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((0x80 >> col) & pattern[row]) {
                        ctx.fillRect((ox + col * 2) * SCALE, (oy + row * 2) * SCALE, 2 * SCALE, 2 * SCALE);
                    }
                }
            }
        }

        // 高画質OLED再描画
        function drawOLED() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#38bdf8";
            ctx.font = `bold ${10 * SCALE}px monospace`;
            ctx.fillText(`DATE ${state.date}`, 0, 10 * SCALE);
            ctx.fillText(`TIME ${state.time}`, 0, 20 * SCALE);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillText(`HOSUU ${state.steps}歩`, 0, 30 * SCALE);
            
            ctx.fillStyle = "#4ade80";
            ctx.fillText(`BLE:ON`, 0, 40 * SCALE);

            const pat = (Math.floor(state.animeTick / 2) % 2 === 0) ? man_pattern1 : man_pattern2;
            ctx.fillStyle = "#ffffff";
            drawDotCharacter(state.charX, 48, pat);
        }

        // コース状況の更新
        function updateCourseInfo(steps) {
            const meters = Math.round(steps * 0.7);
            let currentLoc = STAGES[0].name;
            for (let i = 0; i < STAGES.length; i++) {
                if (meters >= STAGES[i].dist) {
                    currentLoc = STAGES[i].name;
                }
            }
            document.getElementById('locName').innerText = currentLoc;
            document.getElementById('distText').innerText = `累計: ${meters.toLocaleString()} m / 42,195 m`;
            
            const rate = Math.min(100, ((meters / 42195) * 100).toFixed(1));
            document.getElementById('courseBar').style.width = rate + '%';
            document.getElementById('percent').innerText = rate + '%';
        }

        // BLE接続処理
        async function connectBLE() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Pico2W-Step' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                
                // データ受信用 (TX)
                const txCharacteristic = await service.getCharacteristic(UART_TX_UUID);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleData);

                // データ送信用 (RX) の保持
                rxCharacteristic = await service.getCharacteristic(UART_RX_UUID);

                document.getElementById('connectBtn').innerText = "接続完了 (通信中)";
                document.getElementById('connectBtn').disabled = true;
